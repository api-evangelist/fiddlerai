aid: fiddlerai
name: fiddler.ai
description: >-
  Fiddler AI is an enterprise AI Observability and Security platform — an "AI Control
  Plane" for AI agents, LLM applications, and traditional ML models. It delivers unified
  monitoring, real-time guardrails (safety, hallucination/faithfulness, and PII/sensitive-data
  detection), evaluation and experiments, drift and performance tracking, LLM-as-a-Judge
  custom evaluators, alerting, and governance/compliance across the AI lifecycle. Fiddler
  exposes a REST API (v3), an official Python client (fiddler-client), OpenTelemetry-native
  ingestion, and a remote MCP server for agent-native access to observability data.
